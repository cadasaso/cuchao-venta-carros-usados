{% extends 'base.html' %}
{% block title %}Iniciar sesión - Cuchao{% endblock %}
{% block content %}
<div class="form-card">
    <h1>Bienvenido de vuelta</h1>
    <p class="subtitle">Inicia sesión para acceder a tu cuenta</p>
    <form method="post" novalidate>
        {% csrf_token %}
        {% if error %}<div class="error-box">{{ error }}</div>{% endif %}
        <label for="id_username">Usuario</label>
        <input type="text" id="id_username" name="username" placeholder="Tu usuario" required>
        <label for="id_password">Contraseña</label>
        <input type="password" id="id_password" name="password" placeholder="••••••••" required>
        <button type="submit">Entrar</button>
        <p class="form-footer">¿No tienes cuenta? <a href="{% url 'register' %}">Regístrate gratis</a></p>
    </form>
</div>
{% endblock %}
